name: Refresh official ingredient data

# Rebuilds api/data/generated/additives.generated.json from open data sources
# (see scripts/build-official-data.mjs) and commits it if anything changed.
# Vercel redeploys automatically on the commit.

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st of every month
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "data-sources/iarc.csv"
      - "data-sources/fssai.csv"
      - "scripts/build-official-data.mjs"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data
        run: node scripts/build-official-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- api/data/generated; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/data/generated
          git commit -m "Refresh official ingredient data"
          git push
